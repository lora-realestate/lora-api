services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lora-api:dev
    container_name: lora-api-dev
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      PYTHONPATH: "/app/src"
      FASTAPI_ENV: development
    volumes:
      - ./src:/app/src:delegated
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
